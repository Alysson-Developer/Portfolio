services:
  - type: web
    name: portfolio
    runtime: docker
    plan: 0.5c-512mb
    healthCheckPath: /health
    disk:
      name: portfolio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Portfolio__StoragePath
        value: /var/data
      - key: Admin__Password
        sync: false
